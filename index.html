<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jay Ambe POS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: linear-gradient(135deg, #077a57 0%, #09a872 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
  .container { text-align: center; background: white; padding: 50px 30px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  h1 { color: #077a57; font-size: 32px; margin-bottom: 30px; }
  .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
  .button-group.single { grid-template-columns: 1fr; }
  button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; }
  .btn-primary { background: #077a57; color: white; }
  .btn-primary:hover { background: #055c41; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(7,122,87,0.3); }
  .btn-secondary { background: #f07c10; color: white; }
  .btn-secondary:hover { background: #c96208; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(240,124,16,0.3); }
  .info { color: #666; font-size: 12px; margin-top: 30px; line-height: 1.6; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #077a57; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 20px; }
</style>
<!--
  Jay Ambe POS — Launcher Page

  VERSION UPDATE:
  const appVersion = 'v26.html'  →  const appVersion = 'v27.html'
-->
</head>
<body>
<div class="container">
  <h1>🍔 Jay Ambe POS</h1>

  <div id="loading" class="loading" style="display: none;">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <div id="menu">
    <p style="color: #666; margin-bottom: 30px;">Choose Your Option:</p>

    <div class="button-group single">
      <button class="btn-primary" onclick="openApp()">
        ▶ MAIN APP (v26)
      </button>
    </div>

    <div class="button-group single">
      <button class="btn-secondary" onclick="openTestPrint()">
        🖨️ PRINT TEST
      </button>
    </div>

    <div class="info">
      <p>✅ Main app opens v26.html<br>
      🖨️ Test page for one-click print<br>
      Press <strong>Ctrl+P</strong> anytime for instant print</p>
    </div>
  </div>
</div>

<script>
  const appVersion = 'v26.html';  // Change when updating versions

  function showLoading() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
  }

  function openApp() {
    showLoading();
    // Direct navigation without delay
    window.location.href = appVersion;
  }

  function openTestPrint() {
    showLoading();
    window.location.href = 'test-print.html';
  }

  // Auto-open main app after 3 seconds if no click (optional)
  // Uncomment below to auto-launch:
  // setTimeout(() => openApp(), 3000);

  console.log('🍔 Jay Ambe POS Launcher Ready');
</script>
</body>
</html>
