:root{
 --bg:#f4f3ff;--card:#ffffff;--ink:#1e1b4b;--muted:#5b5a7a;--line:#e4e2f5;
 --blue:#4f46e5;--purple:#7c3aed;--orange:#f97316;--gold:#f59e0b;
 --ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--skip:#ea580c;--skipbg:#ffedd5;
 --sel:#ede9fe;--shadow:0 6px 24px rgba(79,70,229,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f0d23;--card:#1b1838;--ink:#eeeaff;--muted:#a8a4c8;--line:#2e2a55;--sel:#2e2366;
 --okbg:#0f3a22;--badbg:#45161a;--skipbg:#47240c;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0f0d23;--card:#1b1838;--ink:#eeeaff;--muted:#a8a4c8;--line:#2e2a55;--sel:#2e2366;
 --okbg:#0f3a22;--badbg:#45161a;--skipbg:#47240c;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Mukta,"Noto Sans Devanagari","Kohinoor Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:860px;margin:0 auto;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 4px 18px rgba(79,70,229,.35)}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:1.05rem;flex:1;line-height:1.2}
.brand small{display:block;font-weight:400;opacity:.85;font-size:.8rem}
.iconbtn{background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:grid;place-items:center}
.hero{margin:18px 0;padding:22px;border-radius:24px;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 60%,#a855f7 100%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h1{margin:0 0 4px;font-size:1.7rem;line-height:1.25}
.hero p{margin:0;opacity:.92}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;font-size:.82rem}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fbbf24 0,#f97316 70%);opacity:.45}
h2.sec{font-size:1.15rem;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec:before{content:"";width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--orange),var(--gold))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.setcard{text-align:left;color:var(--ink);background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s;position:relative;min-height:118px}
.setcard:active{transform:scale(.97)}
.setcard .no{font-size:.75rem;font-weight:700;color:var(--purple);letter-spacing:.04em}
.setcard .yr{font-size:1.35rem;font-weight:700;line-height:1.3}
.setcard .st{font-size:.78rem;color:var(--muted)}
.setcard.na{opacity:.72}
.setcard.na .yr{color:var(--muted)}
.setcard.model{background:linear-gradient(135deg,#fff7ed,#fef3c7);border-color:#fcd34d;color:#1e1b4b}
.setcard.model .st{color:#7c5a10}
.badge{position:absolute;top:10px;right:10px;font-size:.68rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.gold{background:linear-gradient(90deg,var(--orange),var(--gold));color:#fff}
.badge.green{background:var(--ok);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.mode .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;flex:none;color:#fff}
.mode b{display:block;line-height:1.3}
.mode span{font-size:.8rem;color:var(--muted);line-height:1.3;display:block}
.btn{border-radius:14px;padding:10px 16px;font-weight:700;background:var(--line);color:var(--ink);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff}
.btn.org{background:linear-gradient(90deg,var(--orange),var(--gold));color:#fff}
.btn.red{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
.warnbox{background:var(--skipbg);border-left:5px solid var(--orange);padding:10px 14px;border-radius:12px;font-size:.88rem;margin:12px 0}
.infobox{background:var(--sel);border-left:5px solid var(--purple);padding:10px 14px;border-radius:12px;font-size:.88rem;margin:12px 0}
/* exam */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--blue)}
.exbar{background:linear-gradient(120deg,var(--blue),var(--purple));color:#fff;padding:10px 16px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.exbar .in{max-width:860px;margin:0 auto}
.exbar .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.timer{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.timer.low{background:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .4s}
.qcard{background:var(--card);border-radius:24px;padding:20px;margin-top:16px;box-shadow:var(--shadow);border:1px solid var(--line);animation:slide .25s ease}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px;gap:6px;flex-wrap:wrap}
.qtext{font-size:1.22rem;font-weight:700;line-height:1.55;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;font-size:1.06rem;transition:all .15s}
.opt .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on{border-color:var(--purple);background:var(--sel)}
.opt.on .rd{border-color:var(--purple);background:var(--purple)}
.opt.on .rd:after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.opt .lt{font-weight:700;color:var(--purple)}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.navbtns .full{grid-column:1/-1}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.palette button{height:40px;border-radius:10px;background:var(--line);color:var(--ink);font-weight:700;font-size:.9rem}
.palette .a{background:var(--purple);color:#fff}
.palette .m{background:var(--gold);color:#fff}
.palette .c{outline:3px solid var(--orange)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
/* result */
.rhead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media(max-width:560px){.rhead{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{width:170px;height:170px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
.passbig{font-size:1.5rem;font-weight:700}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s ease}
.tp{margin:10px 0}
.tp .h{display:flex;justify-content:space-between;font-size:.9rem}
/* review */
.rv{border-radius:20px;padding:16px;margin:12px 0;border:2px solid var(--line);background:var(--card)}
.rv.ok{border-color:var(--ok)}.rv.bad{border-color:var(--bad)}.rv.skip{border-color:var(--skip)}
.rv .tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff}
.rv.ok .tag{background:var(--ok)}.rv.bad .tag{background:var(--bad)}.rv.skip .tag{background:var(--skip)}
.ro{padding:8px 12px;border-radius:12px;margin:5px 0;border:1px solid var(--line)}
.ro.right{background:var(--okbg);border-color:var(--ok);font-weight:700}
.ro.mine{background:var(--badbg);border-color:var(--bad)}
.exp{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.exp h4{margin:6px 0 2px;font-size:.92rem;color:var(--purple)}
.exp p{margin:0 0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;border-radius:99px;padding:6px 14px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:.9rem}
.tabs button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.modal{position:fixed;inset:0;background:rgba(15,13,35,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border-radius:22px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slide .2s}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t td,table.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.bm{background:none;font-size:1.3rem;color:var(--gold);padding:0 4px}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:.85rem}
select{font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.pri-H{color:#fff;background:#dc2626}.pri-M{color:#fff;background:#f59e0b}.pri-L{color:#fff;background:#64748b}
.pill{font-size:.72rem;padding:1px 8px;border-radius:99px;font-weight:700}
footer{text-align:center;font-size:.78rem;color:var(--muted);margin-top:30px}
@media print{header.top,.noprint{display:none!important}.rv{break-inside:avoid}}
</style>
</head>

 "‘किन्डरगार्टन’ (बालबगैँचा) शिक्षा प्रणालीका संस्थापक को हुन्?", "o": ["मारिया मोन्टेसरी", "फ्रेडरिक फ्रोबेल", "जोन लक", "पेस्टालोजी"], "a": 1, "why": "जर्मन शिक्षाविद् फ्रेडरिक फ्रोबेलले किन्डरगार्टनको स्थापना गरेका हुन्।", "wrong": "मोन्टेसरी – मोन्टेसरी विधि, पेस्टालोजी – मनोवैज्ञानिक शिक्षण, जोन लक – ‘Tabula rasa’।", "tip": "फ्रोबेल = फूलबारी (Kinder + Garten)।", "src": "Friedrich Froebel"}, {"id": "A26", "set": "A", "t": "method", "p": "L", "q": "शिक्षकले आफ्नै कक्षाकोठाको समस्या समाधान गर्न गर्ने सानो अनुसन्धानलाई के भनिन्छ?", "o": ["ऐतिहासिक अनुसन्धान", "प्रयोगात्मक अनुसन्धान", "कार्यमूलक अनुसन्धान", "सर्वेक्षण"], "a": 2, "why": "कक्षाको तत्कालीन समस्या पहिचान गरी समाधान खोज्ने अनुसन्धान कार्यमूलक (Action) अनुसन्धान हो।", "wrong": "ऐतिहासिक अनुसन्धानले विगत अध्ययन गर्छ; प्रयोगात्मक र सर्वेक्षण ठूलो र सामान्यीकरणतर्फ लक्षित हुन्छन्।", "tip": "Action = तुरुन्त कक्षामा काम।", "src": "शैक्षिक अनुसन्धान सम्बन्धी पाठ्यपुस्तक"}, {"id": "A27", "set": "A", "t": "eval", "p": "H", "q": "शिक्षण सिकाइकै क्रममा विद्यार्थीको सुधारका लागि गरिने मूल्याङ्कन कुन हो?", "o": ["निर्माणात्मक मूल्याङ्कन", "योगात्मक मूल्याङ्कन", "वार्षिक परीक्षा", "छनोट परीक्षा"], "a": 0, "why": "निर्माणात्मक (Formative) मूल्याङ्कन सिकाइको क्रममा पृष्ठपोषण दिन र सुधार गर्न गरिन्छ।", "wrong": "योगात्मक/वार्षिक परीक्षा अन्त्यमा उपलब्धि मापन गर्छन्; छनोट परीक्षा भर्ना/छनोटका लागि हो।", "tip": "Formative = ‘Form’ गर्दै (बीचमै सुधार)।", "src": "शैक्षिक मूल्याङ्कन सम्बन्धी पाठ्यपुस्तक"}, {"id": "A28", "set": "A", "t": "eval", "p": "H", "q": "कुनै परीक्षाले जे मापन गर्नुपर्ने हो त्यही मापन गर्ने गुणलाई के भनिन्छ?", "o": ["विश्वसनीयता", "व्यावहारिकता", "वस्तुनिष्ठता", "वैधता"], "a": 3, "why": "वैधता (Validity) भनेको परीक्षणले मापन गर्नुपर्ने कुरा नै मापन गर्ने गुण हो।", "wrong": "विश्वसनीयता = पटक–पटक उही नतिजा; वस्तुनिष्ठता = परीक्षकअनुसार नफेरिने; व्यावहारिकता = सजिलै प्रयोग गर्न मिल्ने।", "tip": "Valid = ‘ठीक कुरा नाप्ने’; Reliable = ‘भरपर्दो/स्थिर’।", "src": "शैक्षिक मापन तथा मूल्याङ्कन"}, {"id": "A29", "set": "A", "t": "eval", "p": "H", "q": "विद्यालय तहमा निरन्तर विद्यार्थी मूल्याङ्कन प्रणालीलाई अङ्ग्रेजीमा छोटकरीमा के भनिन्छ?", "o": ["SEE", "SLC", "CAS", "CDC"], "a": 2, "why": "निरन्तर विद्यार्थी मूल्याङ्कन = Continuous Assessment System (CAS)।", "wrong": "SLC र SEE परीक्षाका नाम हुन्; CDC पाठ्यक्रम विकास केन्द्र हो।", "tip": "C-A-S = Continuous Assessment System।", "src": "पाठ्यक्रम विकास केन्द्र — निरन्तर विद्यार्थी मूल्याङ्कन"}, {"id": "A30", "set": "A", "t": "eval", "p": "M", "q": "‘Curriculum’ शब्द ल्याटिन भाषाको ‘Currere’ बाट आएको हो। यसको अर्थ के हो?", "o": ["पढ्नु", "दौडनु", "लेख्नु", "सोच्नु"], "a": 1, "why": "Currere को अर्थ ‘दौडनु’ हो; पाठ्यक्रमलाई लक्ष्यतर्फ दौडने बाटो (Race course) मानिन्छ।", "wrong": "पढ्नु, लेख्नु, सोच्नु यस शब्दको अर्थ होइनन्।", "tip": "Currere → Current → दौडने धारा।", "src": "पाठ्यक्रम सम्बन्धी पाठ्यपुस्तक"}, {"id": "A31", "set": "A", "t": "eval", "p": "M", "q": "प्रश्नपत्र निर्माण गर्नुअघि विषयवस्तु र उद्देश्यअनुसार प्रश्न र अंकको भार निर्धारण गर्ने तालिकालाई के भनिन्छ?", "o": ["समय तालिका", "हाजिरी तालिका", "नतिजा तालिका", "विशिष्टीकरण तालिका"], "a": 3, "why": "विशिष्टीकरण तालिका (Specification Grid) ले विषयवस्तु, उद्देश्य तह र अंकभार सन्तुलित बनाउँछ।", "wrong": "अन्य तालिका प्रश्नपत्र निर्माणसँग सम्बन्धित छैनन्।", "tip": "Grid = जाली = प्रश्नको नक्सा।", "src": "पाठ्यक्रम विकास केन्द्र — विशिष्टीकरण तालिका"}, {"id": "A32", "set": "A", "t": "eval", "p": "L", "q": "ब्लुमको शैक्षिक उद्देश्य वर्गीकरण (मूल संस्करण) अनुसार संज्ञानात्मक क्षेत्रको सबैभन्दा माथिल्लो तह कुन हो?", "o": ["मूल्याङ्कन", "बोध", "प्रयोग", "ज्ञान"], "a": 0, "why": "सन् १९५६ को मूल वर्गीकरणमा ज्ञान, बोध, प्रयोग, विश्लेषण, संश्लेषण र मूल्याङ्कन – मूल्याङ्कन सबैभन्दा माथि छ।", "wrong": "ज्ञान सबैभन्दा तल्लो तह हो; बोध र प्रयोग बीचका तह हुन्। (संशोधित संस्करणमा ‘सिर्जना’ सबैभन्दा माथि छ।)", "tip": "ज्ञा–बो–प्र–वि–सं–मू।", "src": "Bloom’s Taxonomy (1956)"}, {"id": "A33", "set": "A", "t": "gk", "p": "H", "q": "नेपालको गण्डकी प्रदेशको राजधानी कहाँ हो?", "o": ["दमौल ‘राष्ट्रिय पाठ्यक्रम प्रारूप’ (National Curriculum Framework) को पछिल्लो संस्करण कुन सालको हो?", "o": ["२०६३", "२०७०", "२०७६", "२०८०"], "a": 2, "why": "विद्यालय शिक्षाको राष्ट्रिय पाठ्यक्रम प्रारूप, २०७६ पछिल्लो संस्करण हो।", "wrong": "२०६३ अघिल्लो प्रारूप हो; २०७० र २०८० मा नयाँ प्रारूप जारी भएको होइन।", "tip": "नीति र प्रारूप दुवै २०७६।", "src": "पाठ्यक्रम विकास केन्द्र, राष्ट्रिय पाठ्यक्रम प्रारूप २०७६"}, {"id": "B13", "set": "B", "t": "psy", "p": "H", "q": "क्रियाप्रसूत अनुबन्धन (Operant Conditioning) सिद्धान्तमा कुन कुरालाई सबैभन्दा बढी जोड दिइन्छ?", "o": ["परिपक्वता", "अन्तर्दृष्टि", "अनुकरण", "पुनर्बलन (Reinforcement)"], "a": 3, "why": "स्किनरको क्रियाप्रसूत अनुबन्धनमा सही व्यवहारपछि दिइने पुनर्बलन (पुरस्कार) ले व्यवहार दोहोरिन्छ।", "wrong": "अन्तर्दृष्टि – कोहलर, अनुकरण – बान्डुरा, परिपक्वता – विकासवादी अवधारणा।", "tip": "स्किनर = स्याबासी (Reinforcement)।", "src": "B. F. Skinner, Operant Conditioning"}, {"id": "B14", "set": "B", "t": "psy", "p": "H", "q": "कोहलरले अन्तर्दृष्टि (Insight) सिद्धान्तको प्रयोग कुन जनावरमा गरेका थिए?", "o": ["चिम्पान्जी", "बिरालो", "कुकुर", "परेवा"], "a": 0, "why": "कोहलरले ‘सुल्तान’ नामको चिम्पान्जीमा प्रयोग गरेका थिए।", "wrong": "कुकुर – पाभलभ, बिरालो – थर्नडाइक, परेवा/मुसा – स्किनर।", "tip": "कोहलर = केरा + चिम्पान्जी + लौरो।", "src": "Wolfgang Köhler, The Mentality of Apes"}, {"id": "B15", "set": "B", "t": "psy", "p": "H", "q": "थर्नडाइकको सिकाइका मुख्य नियममा कुन पर्दैन?", "o": ["तत्परताको नियम", "गुरुत्वाकर्षणको नियम", "प्रभावको नियम", "अभ्यासको नियम"], "a": 1, "why": "थर्नडाइकका मुख्य नियम तत्परता, अभ्यास र प्रभाव हुन्। गुरुत्वाकर्षण भौतिक विज्ञानको नियम हो।", "wrong": "तत्परता, अभ्यास र प्रभाव — यी तीनै थर्नडाइकका नियम हुन्, त्यसैले ती उत्तर होइनन्।", "tip": "त–अ–प (तयार, अभ्यास, परिणाम)।", "src": "E. L. Thorndike, Laws of Learning"}, {"id": "B16", "set": "B", "t": "psy", "p": "M", "q": "अवलोकन र अनुकरणबाट सिकाइ हुन्छ भन्ने सामाजिक सिकाइ सिद्धान्त कसको हो?", "o": ["जीन पियाजे", "इभान पाभलभ", "अल्बर्ट बान्डुरा", "कार्ल रोजर्स"], "a": 2, "why": "अल्बर्ट बान्डुराले ‘बोबो डल’ प्रयोगबाट अवलोकनात्मक सिकाइ देखाए।", "wrong": "पाभलभ – शास्त्रीय अनुबन्धन, पियाजे – संज्ञानात्मक विकास, रोजर्स – मानवतावादी मनोविज्ञान।", "tip": "बान्डुरा = बोबो डल।", "src": "Albert Bandura, Social Learning Theory"}, {"id": "B17", "set": "B", "t": "psy", "p": "M", "q": "फ्रायडको व्यक्तित्व संरचनामा ‘नैतिक पक्ष’ (विवेक) को प्रतिनिधित्व कुनले गर्छ?", "o": ["सुपर इगो (Superego)", "इगो (Ego)", "इड (Id)", "लिबिडो"], "a": 0, "why": "सुपर इगो नैतिकता र विवेकको पक्ष हो।", "wrong": "इड – मूल प्रवृत्ति/इच्छा, इगो – यथार्थ र सन्तुलन, लिबिडो – मनोलैङ्गिक ऊर्जा।", "tip": "Super = माथि = नैतिक।", "src": "Sigmund Freud, व्यक्तित्व सिद्धान्त"}, {"id": "B18", "set": "B", "t": "psy", "p": "M", "q": "पहिलो व्यवस्थित बुद्धि परीक्षण कसले निर्माण गरेका हुन्?", "o": ["जीन पियाजे", "हावर्ड गार्डनर", "डेभिड वेक्सलर", "अल्फ्रेड बिने र थियोडोर साइमन"], "a": 3, "why": "सन् १९०५ मा अल्फ्रेड बिने र साइमनले पहिलो बुद्धि परीक्षण बनाए।", "wrong": "गार्डनर – बहुबुद्धि, वेक्सलर – पछि WAIS/WISC परीक्षण, पियाजे – संज्ञानात्मक विकास।", "tip": "Binet = Beginning (सुरुवात)।", "src": "Binet–Simon Scale (1905)"}, {"id": "B19", "set": "B", "t": "psy", "p": "L", "q": "विश्वको पहिलो मनोवैज्ञानिक प्रयोगशाला कसले कहाँ स्थापना गरेका थिए?", "o": ["फ्रायड – भियना", "विलियम जेम्स – हार्वर्ड", "विलियम वुन्ट – लाइप्जिग", "पाभलभ – मस्को"], "a": 2, "why": "विलियम वुन्टले सन् १८७९ मा जर्मनीको लाइप्जिगमा पहिलो मनोवैज्ञानिक प्रयोगशाला स्थापना गरे।", "wrong": "अन्य जोडी पहिलो प्रयोगशालासँग सम्बन्धित छैनन्।", "tip": "वुन्ट – १८७९ – लाइप्जिग।", "src": "मनोविज्ञानको इतिहास"}, {"id": "B20", "set": "B", "t": "psy", "p": "L", "q": "एरिक्सनको मनोसामाजिक विकास सिद्धान्तमा कति अवस्था छन्?", "o": ["४", "५", "६", "८"], "a": 3, "why": "एरिक्सनले जीवनभरिको विकासलाई ८ मनोसामाजिक अवस्थामा बाँडेका छन्।", "wrong": "४ अवस्था पियाजेको, ५ अवस्था फ्रायडको मनोलैङ्गिक सिद्धान्तको हो।", "tip": "एरिक्सन = आठ (E = Eight)।", "src": "Erik Erikson, Psychosocial Stages"}, {"id": "B21", "set": "B", "t": "method", "p": "H", "q": "नियम वा सूत्र पहिले दिएर त्यसपछि उदाहरणमा प्रयोग गराउने विधि कुन हो?", "o": ["आगमन विधि", "निगमन विधि", "खोज विधि", "परियोजना विधि"], "a": 1, "why": "निगमन (Deductive) विधिमा सामान्य नियम → विशिष्ट उदाहरण जाइन्छ।", "wrong": "आगमनमा उदाहरण पहिले; खोज र परियोजना विधिमा विद्यार्थी आफैँ खोज/काम गर्छन्।", "tip": "निगमन = नियम पहिले (दुवै ‘न’)।", "src": "शिक्षण विधि सम्बन्धी पाठ्यपुस्तक"}, {"id": "B22", "set": "B", "t": "method", "p": "H", "q": "हर्बार्टको पाठयोजनाका चरणमध्ये पहिलो चरण कुन हो?", "o": ["प्रस्तुतीकरण", "प्रयोग", "तुलना", "तयारी"], "a": 3, "why": "हर्बार्टका पाँच चरण: तयारी, प्रस्तुतीकरण, तुलना/सम्बन्ध, सामान्यीकरण र प्रयोग। पहिलो तयारी हो।", "wrong": "प्रस्तुतीकरण दोस्रो, तुलना तेस्रो, प्रयोग अन्तिम चरण हो।", "tip": "त–प्र–तु–सा–प्र।", "src": "J. F. Herbart, पाँच औपचारिक चरण"}, {"id": "B23", "set": "B", "t": "method", "p": "M", "q": "अन्वेषण विधि (Heuristic Method) का प्रवर्तक को हुन्?", "o": ["एच. ई. आर्मस्ट्रङ", "किलप्याट्रिक", "मोन्टेसरी", "सोक्रेटिस"], "a": 0, "why": "विद्यार्थीलाई आफैँ खोजकर्ता बनाउने अन्वेषण विधि एच. ई. आर्मस्ट्रङले विकास गरेका हुन्।", "wrong": "किलप्याट्रिक – परियोजना, मोन्टेसरी – मोन्टेसरी विधि, सोक्रेटिस – प्रश्नोत्तर/संवाद विधि।", "tip": "Heuristic = ‘Eureka’ (म खोज्छु) = Armstrong।", "src": "शिक्षण विधि सम्बन्धी पाठ्यपुस्तक"}, {"id": "B24", "set": "B", "t": "method", "p": "M", "q": "डाल्टन योजना (Dalton Plan) कसले सुरु गरेका हुन्?", "o": ["मारिया मोन्टेसरी", "हेलेन पार्कहर्स्ट", "जोन डिवी", "फ्रोबेल"], "a": 1, "why": "हेलेन पार्कहर्स्टले अमेरिकाको डाल्टनमा व्यक्तिगत कार्य–सम्झौतामा आधारित डाल्टन योजना सुरु गरिन्।", "wrong": "मोन्टेसरी, डिवी र फ्रोबेल अन्य विधिसँग सम्बन्धित छन्।", "tip": "Dalton = Helen (D–H)।", "src": "Helen Parkhurst, Dalton Plan"}, {"id": "B25", "set": "B", "t": "method", "p": "M", "q": "सानो समूहमा, छोटो समयमा एउटा शिक्षण सीप अभ्यास गर्ने तालिम प्रविधि कुन हो?", "o": ["कार्यक्रमित शिक्षण", "टोली शिक्षण", "सूक्ष्म शिक्षण", "दूर शिक्षा"], "a": 2, "why": "सूक्ष्म शिक्षणमा ५–१० विद्यार्थी, ५–१० मिनेट र एक सीपमा अभ्यास गरिन्छ।", "wrong": "टोली शिक्षणमा धेरै शिक्षक मिलेर पढाउँछन्; कार्यक्रमित शिक्षण स्व–अध्ययन सामग्री हो; दूर शिक्षा टाढाबाट पढाइ हो।", "tip": "Micro = सानो कक्षा, सानो समय, एक सीप।", "src": "Micro Teaching (Dwight Allen)"}, {"id": "B26", "set": "B", "t": "method", "p": "L", "q": "समावेशी शिक्षाको मुख्य उद्देश्य के हो?", "o": ["सबै बालबालिकालाई भेदभावबिना एउटै विद्यालय/कक्षामा सिक्ने अवसर दिनु", "अपाङ्गता भएका बालबालिकालाई छुट्टै विद्यालयमा मात्र पढाउनु", "राम्रो अंक ल्याउनेलाई मात्र भर्ना गर्नु", "सहरी विद्यालय मात्र विकास गर्नु"], "a": 0, "why": "समावेशी शिक्षाले विविध पृष्ठभूमि र क्षमताका सबै बालबालिकालाई सामान्य विद्यालयमा समान अवसर दिन्छ।", "wrong": "छुट्टै विद्यालय विशेष शिक्षा हो, समावेशी होइन; अंक/सहरका आधारमा छनोट बहिष्करण हो।", "tip": "समावेशी = सबैलाई समेट्ने।", "src": "समावेशी शिक्षा नीति तथा UNESCO Salamanca Statement (1994)"}, {"id": "B27", "set": "B", "t": "eval", "p": "H", "q": "शैक्षिक सत्र वा एकाइको अन्त्यमा उपलब्धि मापन गर्न गरिने मूल्याङ्कन कुन हो?", "o": ["निर्माणात्मक", "निदानात्मक", "प्रारम्भिक", "योगात्मक"], "a": 3, "why": "योगात्मक (Summative) मूल्याङ्कन अन्त्यमा गरिन्छ र प्रमाणपत्र/कक्षोन्नतिमा प्रयोग हुन्छ।", "wrong": "निर्माणात्मक बीचमा सुधारका लागि; निदानात्मक कमजोरी पत्ता लगाउन; प्रारम्भिक सुरुमा तयारी जाँच्न।", "tip": "Summative = Sum (अन्त्यमा जोड)।", "src": "शैक्षिक मूल्याङ्कन"}, {"id": "B28", "set": "B", "t": "eval", "p": "H", "q": "एउटै परीक्षा पटक–पटक लिँदा पनि उस्तै नतिजा आउने गुणलाई के भनिन्छ?", "o": ["वैधता", "विभेदकारिता", "विश्वसनीयता", "सरलता"], "a": 2, "why": "विश्वसनीयता (Reliability) भनेको मापनको स्थिरता/एकरूपता हो।", "wrong": "वैधता – सही कुरा मापन; विभेदकारिता – तेज र कमजोर विद्यार्थी छुट्याउने क्षमता।", "tip": "Reliable = भरोसायोग्य = हरेक पटक उस्तै।", "src": "शैक्षिक मापन तथा मूल्याङ्कन"}, {"id": "B29", "set": "B", "t": "eval", "p": "H", "q": "विद्यार्थीको कमजोरी र सिकाइ कठिनाइको कारण पत्ता लगाउन गरिने परीक्षण कुन हो?", "o": ["उपलब्धि परीक्षण", "निदानात्मक परीक्षण", "बुद्धि परीक्षण", "छन /* ---------- storage (try/catch: private mode safe) ---------- */
const KEY="sangita_tsc_v1";
let S = {history:[],wrong:{},bm:{},imported:[],current:null,theme:null};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)S=Object.assign(S,v)}catch(e){}}
/* दोस्रो सुरक्षित प्रति: IndexedDB (localStorage मेटिए पनि यहाँबाट फिर्ता) */
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open("sangita_tsc",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function idbPut(v){idb().then(db=>{try{db.transaction("kv","readwrite").objectStore("kv").put(v,KEY)}catch(e){}}).catch(()=>{})}
function idbGet(){return idb().then(db=>new Promise(ok=>{try{const q=db.transaction("kv").objectStore("kv").get(KEY);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)}catch(e){ok(null)}})).catch(()=>null)}
let saveT=null;
function save(){const t=JSON.stringify(S);try{localStorage.setItem(KEY,t)}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>idbPut(t),300)}
load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

function allQ(){return DB.concat(S.imported||[])}
function byId(id){return allQ().find(q=>q.id===id)}
function yearQs(y){return (S.imported||[]).filter(q=>q.year===y)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function quickIds(){
 const pick=s=>DB.filter(q=>q.set===s&&q.p==="H");
 const take=(arr)=>{const seen={},out=[];for(const q of arr){if(!seen[q.t]&&out.length<6){seen[q.t]=1;out.push(q)}}for(const q of arr){if(out.length<6&&!out.includes(q))out.push(q)}return out};
 return take(pick("A")).concat(take(pick("B"))).map(q=>q.id);
}

/* ---------- exam engine ---------- */
function startExam(o){
 // o: {title, ids, full:boolean, minutes, kind}
 if(!o.ids.length){toast("यस मोडमा अहिले कुनै प्रश्न छैन।");return}
 S.current={title:o.title,ids:o.ids,ans:{},mark:{},idx:0,full:!!o.full&&o.ids.length===RULE.total,kind:o.kind||"practice",
  dur:Math.round((o.minutes|| (o.ids.length*RULE.minutes/RULE.total))*60),started:Date.now(),elapsed:0};
 save(); render("exam");
}
let tick=null, lastT=0;
function remaining(){const c=S.current;return c.dur-c.elapsed}
let saveCt=0;
function stopTimer(){clearInterval(tick);tick=null}
function startTimer(){
 if(tick) return; lastT=Date.now();
 tick=setInterval(()=>{const c=S.current;if(!c){stopTimer();return}
  const now=Date.now();c.elapsed+=(now-lastT)/1000;lastT=now;
  const r=remaining(); const el=$("#tm"); if(el){el.textContent=clock(r);el.classList.toggle("low",r<=120)}
  if(++saveCt%5===0)save();
  if(r<=0){stopTimer();toast("समय सकियो — परीक्षा स्वतः बुझाइयो।");finish()}
 },500);
}
function clock(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),x=s%60;return NUM(String(m).padStart(2,"0"))+":"+NUM(String(x).padStart(2,"0"))}
function finish(){
 stopTimer();
 const c=S.current; if(!c)return;
 let right=0,wrong=0,skip=0; const tstat={}; const items=[];
 c.ids.forEach(id=>{const q=byId(id); if(!q)return; const a=c.ans[id];
  const ts=tstat[q.t]||(tstat[q.t]={n:0,r:0,w:0,s:0});ts.n++;
  let st,m;
  if(a===undefined||a===null){skip++;ts.s++;st="skip";m=RULE.unanswered}
  else if(a===q.a){right++;ts.r++;st="ok";m=RULE.mark;delete S.wrong[id]}
  else {wrong++;ts.w++;st="bad";m=-RULE.neg;S.wrong[id]=(S.wrong[id]||0)+1}
  items.push({id,a:a??null,st,m});
 });
 const full=c.ids.length*RULE.mark; const neg=wrong*RULE.neg;
 const score=right*RULE.mark-neg;
 const res={id:Date.now(),title:c.title,kind:c.kind,full:c.full,n:c.ids.length,right,wrong,skip,fullMarks:full,
  neg,score,pct:full?Math.max(0,score)/full*100:0,secs:Math.round(Math.min(c.elapsed,c.dur)),date:new Date().toISOString(),tstat,items,
  pass:c.full?score>=RULE.pass:null};
 S.history.unshift(res); S.history=S.history.slice(0,60); S.current=null; save();
 view.result=res.id; render("result");
 if(res.pct>=60) confetti();
}

 <div class="prog"><i style="width:${done/n*100}%"></i></div><div style="font-size:.78rem;opacity:.9;margin-top:4px">${NUM(done)}/${NUM(n)} उत्तर दिइयो</div></div></div>

   <button class="btn ${c.mark[q.id]?'org':''}" onclick="markQ()">${c.mark[q.id]?"✓ समीक्षामा राखियो":"पछि समीक्षा गर्नुहोस्"}</button>

  <div class="palette">${c.ids.map((id,i)=>`<button class="${c.ans[id]!==undefined?'a':''} ${c.mark[id]?'m':''} ${i===c.idx?'c':''}" onclick="jump(${i})">${NUM(i+1)}</button>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--purple)"></i>उत्तर दिइएको</span><span><i style="background:var(--gold)"></i>पछि समीक्षा</span><span><i style="background:var(--line)"></i>बाँकी</span></div>
 </div>

};
function pick(i){const c=S.current,id=c.ids[c.idx];c.ans[id]=i;save();render("exam")}
function go(d){const c=S.current;c.idx=Math.max(0,Math.min(c.ids.length-1,c.idx+d));save();render("exam")}
function jump(i){S.current.idx=i;save();render("exam")}
function skipQ(){const c=S.current;delete c.ans[c.ids[c.idx]];if(c.idx<c.ids.length-1)c.idx++;save();render("exam")}
function markQ(){const c=S.current,id=c.ids[c.idx];c.mark[id]=!c.mark[id];save();render("exam")}
function toggleBm(id){if(S.bm[id])delete S.bm[id];else S.bm[id]=Date.now();save();render()}
function askFinish(){const c=S.current;const left=c.ids.length-Object.keys(c.ans).length;const mk=Object.values(c.mark).filter(Boolean).length;
 modal(`<h3 style="margin-top:0">परीक्षा समाप्त गर्ने?</h3>
 ${left?`<div class="warnbox">⚠️ अझै <b>${NUM(left)}</b> प्रश्नको उत्तर दिइएको छैन।</div>`:`<p>तपाईंले सबै प्रश्नको उत्तर दिनुभएको छ। 👏</p>`}
 ${mk?`<p class="note">${NUM(mk)} प्रश्न “पछि समीक्षा” मा छन्।</p>`:""}
 <p class="note">बाँकी समय: ${clock(remaining())}</p>
 <div class="row"><button class="btn red" onclick="closeModal();finish()">हो, बुझाउनुहोस्</button><button class="btn" onclick="closeModal()">फर्कनुहोस्</button></div>`)}

 <circle cx="85" cy="85" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset 1.2s ease" data-off="${C*(1-p/100)}"/>
 <text x="85" y="82" text-anchor="middle" font-size="32" font-weight="700" fill="var(--ink)" font-family="Mukta">${fmt(p,0)}%</text><text x="85" y="108" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Mukta">प्रतिशत</text></svg>`}
function animBars(){document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w);document.querySelectorAll("[data-off]").forEach(e=>e.style.strokeDashoffset=e.dataset.off)}
function getRes(){return S.history.find(h=>h.id===view.result)}

 const ts=Object.entries(r.tstat).map(([t,v])=>({t,...v,p:v.n?v.r/v.n*100:0})).sort((a,b)=>a.p-b.p);
 const weak=ts.filter(x=>x.p<50), improve=ts.filter(x=>x.p>=50&&x.p<80);
 return topbar("नतिजा")+`<div class="wrap">
 <div class="card" style="margin-top:16px" id="rcard">
  <div class="rhead">${ringSVG(Math.max(0,r.pct),col)}

   ${r.full?`<div class="passbig" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.pass?"🎉 उत्तीर्ण":"अनुत्तीर्ण"} <span class="note">(अभ्यास नतिजा)</span></div><div class="note">उत्तीर्णाङ्क ${NUM(RULE.pass)}/${NUM(RULE.full)} को आधारमा</div>`
   :`<div class="note" style="margin-top:6px">यो छोटो/अपूर्ण अभ्यास हो — पूर्ण वास्तविक परीक्षा होइन, त्यसैले उत्तीर्ण/अनुत्तीर्ण देखाइएको छैन।</div>`}
  </div></div>
  <div class="stats">
   ${stat(NUM(r.n),"जम्मा प्रश्न")}${stat(NUM(r.right),"सही उत्तर","var(--ok)")}${stat(NUM(r.wrong),"गलत उत्तर","var(--bad)")}${stat(NUM(r.skip),"उत्तर नदिएका","var(--skip)")}
   ${stat(NUM(r.fullMarks),"पूर्णाङ्क")}${stat(fmt(r.score),"प्राप्ताङ्क","var(--purple)")}${stat("−"+fmt(r.neg),"Negative Marking","var(--bad)")}${stat(fmt(r.pct,1)+"%","प्रतिशत")}
   ${stat(dur(r.secs),"लागेको समय")}${stat(dt(r.date),"मिति")}
  </div>
  ${prev?`<div class="infobox">📊 अघिल्लो पटक यही सेटमा: ${fmt(prev.score)} अंक → अहिले ${fmt(r.score)} अंक (${r.score>=prev.score?"▲ +":"▼ "}${fmt(r.score-prev.score)})</div>`:""}
 </div>
 <h2 class="sec">विषयगत प्रदर्शन</h2>
 <div class="card">${ts.map(x=>`<div class="tp"><div class="h"><span>${TOPICS[x.t]}</span><span>${NUM(x.r)}/${NUM(x.n)} • ${fmt(x.p,0)}%</span></div><div class="bar"><i data-w="${x.p}%" style="background:${TCOL[x.t]}"></i></div></div>`).join("")}
 <p><b>कमजोर विषय:</b> ${weak.length?weak.map(x=>TOPICS[x.t]).join(", "):"छैन 👏"}</p>
 <p style="margin:0"><b>सुधार गर्नुपर्ने विषय:</b> ${improve.length?improve.map(x=>TOPICS[x.t]).join(", "):"—"}</p></div>
 <div class="row noprint" style="margin-top:16px">
  <button class="btn pri" onclick="render('review')">📝 सम्पूर्ण उत्तर समीक्षा</button>
  ${r.wrong?`<button class="btn red" onclick="retryWrong()">✗ गलत प्रश्न मात्र पुनः</button>`:""}
  <button class="btn org" onclick="downloadCard()">⬇ Result Card (PNG)</button>
  ${FRAMED?"":`<button class="btn" onclick="window.print()">🖨 Print</button>`}
  <button class="btn ghost" onclick="render('home')">गृहपृष्ठ</button>
 </div></div>`;
};

function reviewCard(q,it,n){

 ${expl(q)}</div>`;
}

V.data=()=>topbar("डाटा र प्रश्न थप")+`<div class="wrap">
 <h2 class="sec">ब्याकअप (फोन फेर्दा काम लाग्छ)</h2><div class="card"><p class="note">तपाईंको इतिहास, गलत प्रश्न र Bookmark यही ब्राउजरमा मात्र सुरक्षित छन्। ब्राउजर डाटा मेटाउनुअघि ब्याकअप लिनुहोस्।</p>
 <div class="row"><button class="btn pri" onclick="exportData()">⬇ ब्याकअप डाउनलोड</button><label class="btn">⬆ ब्याकअप फाइलबाट फिर्ता<input type="file" accept=".json,application/json,text/plain" hidden onchange="importFile(this,'backup')"></label></div>
 <p class="note" style="margin-top:10px">वा ब्याकअप पाठ यहाँ टाँस्नुहोस्:</p><textarea id="bkin" placeholder='{"history":[...]}'></textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="restoreText($('#bkin').value)">पाठबाट फिर्ता</button></div>
 ${S.lastBackup?`<p class="note">अन्तिम ब्याकअप: ${dt(S.lastBackup,1)}</p>`:""}</div>
 <h2 class="sec">प्रमाणित पुराना प्रश्न थप्नुहोस्</h2><div class="card">
 <p class="note">आयोगको प्रश्नपत्रबाट प्रमाणित प्रश्न मात्र थप्नुहोस्। प्रत्येक प्रश्नमा साल (year) र स्रोत (src) अनिवार्य छ। a = सही उत्तरको क्रम (क=०, ख=१, ग=२, घ=३)। t = विषय कोड: ${Object.keys(TOPICS).join(", ")}।</p>
 <textarea id="imp">[{"year":"२०८१","t":"const","p":"H","q":"प्रश्न यहाँ","o":["क","ख","ग","घ"],"a":0,"why":"व्याख्या","wrong":"अन्य विकल्प किन गलत","tip":"","src":"tsc.gov.np प्रश्नपत्र, २०८१","repeat":1}]</textarea>
 <div class="row" style="margin-top:8px"><button class="btn org" onclick="importQs($('#imp').value)">प्रश्न थप्नुहोस्</button><label class="btn">JSON फाइल छान्नुहोस्<input type="file" accept=".json" hidden onchange="importFile(this,'qs')"></label>
 ${(S.imported||[]).length?`<button class="btn red" onclick="askYes('थपिएका सबै प्रश्न हटाउने?',()=>{S.imported=[];save();render()})">थपिएका ${NUM(S.imported.length)} प्रश्न हटाउनुहोस्</button>`:""}</div></div>
 <h2 class="sec">होम स्क्रिनमा राख्नुहोस्</h2><div class="card note"><b>iPhone (Safari):</b> तलको Share ⬆ बटन → “Add to Home Screen”।<br><b>Android (Chrome):</b> माथि ⋮ मेनु → “Add to Home screen” / “Install app”।<br>एक पटक खोलेपछि इन्टरनेट नभए पनि अभ्यास गर्न मिल्छ (होस्ट गरिएको PWA संस्करणमा)।</div></div>`;
function download(name,text,type="application/json"){const b=text instanceof Blob?text:new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportData(){const t=JSON.stringify(S);S.lastBackup=Date.now();save();
 if(!FRAMED){const name="sangita-tsc-backup-"+new Date().toISOString().slice(0,10)+".json";
  try{const f=new File([t],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"संगीता TSC ब्याकअप"}).catch(()=>{});return}}catch(e){}
  download(name,t);return}modal(`<h3 style="margin-top:0">ब्याकअप</h3><p class="note">यो पाठ कपी गरेर सुरक्षित राख्नुहोस्।</p><textarea id="bk" readonly>${esc(t)}</textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="cpb">कपी गर्नुहोस्</button><button class="btn" onclick="closeModal()">बन्द</button></div>`);$("#cpb").onclick=()=>{const el=$("#bk");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("कपी भयो ✓")).catch(()=>{el.select()})}}
function restoreText(t){try{const v=JSON.parse(t);if(!v.history)throw 0;S=Object.assign(S,v);save();toast("ब्याकअप फिर्ता भयो ✓");render("home")}catch(e){toast("ब्याकअप पाठ मिलेन।")}}
function importFile(inp,kind){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(kind==="qs")importQs(r.result);else{try{const v=JSON.parse(r.result);if(!v.history)throw 0;S=Object.assign(S,v);save();toast("ब्याकअप फिर्ता भयो ✓");render("home")}catch(e){toast("फाइल मिलेन।")}}};r.readAsText(f)}
function importQs(txt){let arr;try{arr=JSON.parse(txt)}catch(e){toast("JSON ढाँचा मिलेन।");return}
 if(!Array.isArray(arr))arr=[arr];let ok=0,bad=0;
 arr.forEach((q,i)=>{if(q&&YEARS.includes(q.year)&&q.q&&Array.isArray(q.o)&&q.o.length===4&&Number.isInteger(q.a)&&q.a>=0&&q.a<4&&q.src&&TOPICS[q.t]){
   q.id="Y"+q.year+"-"+Date.now().toString(36)+i;q.p=q.p||"M";q.why=q.why||"";q.wrong=q.wrong||"";S.imported.push(q);ok++}else bad++});
 save();toast(NUM(ok)+" प्रश्न थपियो"+(bad?", "+NUM(bad)+" अमान्य":""));render()}

/* result card PNG */
function downloadCard(){const r=getRes();const c=document.createElement("canvas");const W=1080,H=1350;c.width=W;c.height=H;const x=c.getContext("2d");
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,"#4f46e5");g.addColorStop(1,"#7c3aed");x.fillStyle="#f4f3ff";x.fillRect(0,0,W,H);x.fillStyle=g;x.fillRect(0,0,W,300);
 const F=(s,w=400)=>`${w} ${s}px Mukta, sans-serif`;x.fillStyle="#fff";x.font=F(40);x.fillText("शिक्षक सेवा आयोग २०८३ • निम्नमाध्यमिक तह",60,90);x.font=F(72,700);x.fillText("संगीता सुनार",60,190);x.font=F(36);x.fillText(r.title.slice(0,48),60,255);
 x.beginPath();x.lineWidth=40;x.strokeStyle="#e4e2f5";x.arc(W/2,560,180,0,7);x.stroke();x.beginPath();x.strokeStyle=r.pct>=60?"#16a34a":r.pct>=40?"#f59e0b":"#dc2626";x.lineCap="round";x.arc(W/2,560,180,-Math.PI/2,-Math.PI/2+Math.max(0.001,Math.max(0,r.pct)/100*2*Math.PI));x.stroke();
 x.fillStyle="#1e1b4b";x.textAlign="center";x.font=F(96,700);x.fillText(fmt(r.pct,0)+"%",W/2,590);x.font=F(36);x.fillText(fmt(r.score)+" / "+NUM(r.fullMarks)+" अंक",W/2,645);
 if(r.full){x.font=F(56,700);x.fillStyle=r.pass?"#16a34a":"#dc2626";x.fillText(r.pass?"उत्तीर्ण (अभ्यास)":"अनुत्तीर्ण (अभ्यास)",W/2,830)}
 x.textAlign="left";const rows=[["जम्मा प्रश्न",NUM(r.n)],["सही",NUM(r.right)],["गलत",NUM(r.wrong)],["उत्तर नदिएका",NUM(r.skip)],["Negative Marking","−"+fmt(r.neg)],["समय",dur(r.secs)]];
 rows.forEach((rw,i)=>{const cx=60+(i%2)*500,cy=920+Math.floor(i/2)*110;x.fillStyle="#fff";x.fillRect(cx,cy,460,90);x.fillStyle="#5b5a7a";x.font=F(30);x.fillText(rw[0],cx+24,cy+38);x.fillStyle="#1e1b4b";x.font=F(38,700);x.fillText(rw[1],cx+24,cy+78)});
 x.fillStyle="#5b5a7a";x.font=F(26);x.fillText(dt(r.date,1)+" • TSC स्मार्ट परीक्षा",60,1300);
 const url=c.toDataURL("image/png");modal(`<h3 style="margin-top:0">Result Card</h3><img src="${url}" style="width:100%;border-radius:12px"><p class="note">फोनमा: फोटोमा लामो थिचेर “Save Image/Download image” छान्नुहोस्।</p><div class="row">${FRAMED?"":`<button class="btn org" id="dlc">⬇ डाउनलोड</button>`}<button class="btn" onclick="closeModal()">बन्द</button></div>`);if(!FRAMED)$("#dlc").onclick=()=>c.toBlob(b=>download("sangita-result-card.png",b,"image/png"))}

/* ui helpers */
function modal(h){closeModal();const d=document.createElement("div");d.className="modal";d.id="mdl";d.innerHTML=`<div class="box">${h}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.appendChild(d)}
function closeModal(){const m=$("#mdl");if(m)m.remove()}
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:10px 18px;border-radius:14px;z-index:70;font-size:.95rem;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function confetti(){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#4f46e5","#7c3aed","#f97316","#f59e0b","#16a34a","#db2777"];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.random()*6|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));let f=0;
 (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<220)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}
